name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: new advisories appear without code changes

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans full history
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Secret scan (gitleaks 8.30.1, checksum-verified)
        run: |
          f=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$f
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt | grep " $f\$" | sha256sum -c -
          tar xzf $f gitleaks
          ./gitleaks git --redact --no-banner .
      - name: Dependency audit (both locked PyTorch builds)
        # Local version labels (+cpu/+cu130) are stripped because advisories are published against the
        # upstream version and the PyTorch index is not PyPI. The lockfile already pins the full closure,
        # so --no-deps audits exactly what is installed.
        run: |
          for extra in cpu cu130; do
            uv export --frozen --extra "$extra" --no-hashes --no-emit-project | sed -E "s/\+(cpu|cu130)//" > "requirements-audit-$extra.txt"
            uvx pip-audit==2.9.0 --strict --disable-pip --no-deps -r "requirements-audit-$extra.txt"
          done
